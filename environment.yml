name: regusync
channels:
  - https://conda.anaconda.org/pytorch
  - https://conda.anaconda.org/nvidia
  - https://conda.anaconda.org/conda-forge
  - nodefaults
dependencies:
  # Tested runtime: Linux x86_64, Python 3.9, PyTorch 2.2, and CUDA 12.1.
  - python=3.9.19
  - pip=24.0
  - pytorch=2.2.0
  - pytorch-cuda=12.1
  - cuda-version=12.1
  - torchtext=0.17.0

  # Direct numerical and data dependencies used by the public pipeline.
  - numpy=1.24.3
  - scipy=1.13.1
  - scikit-learn=1.4.0
  - h5py=3.11.0

  # FlashAttention wheel/runtime helpers.
  - ninja
  - packaging=24.1
  - psutil=6.0.0
  - setuptools=69.5.1
  - wheel=0.43.0

  - pip:
      # Keep pip from replacing the Conda-resolved numerical and Torch stack.
      - torch==2.2.0
      - numpy==1.24.3
      - scipy==1.13.1
      - scikit-learn==1.4.0
      - h5py==3.11.0
      - packaging==24.1
      - setuptools==69.5.1
      - anndata==0.10.8
      - pandas==2.3.3
      - scanpy==1.9.8
      - episcanpy==0.4.0
      - scvi-tools==1.1.6.post2
      - squidpy==1.6.1
      # Prebuilt for CPython 3.9, PyTorch 2.2, CUDA 12.x, and Linux x86_64.
      - "flash-attn @ https://github.com/Dao-AILab/flash-attention/releases/download/v2.5.2/flash_attn-2.5.2+cu122torch2.2cxx11abiFALSE-cp39-cp39-linux_x86_64.whl"
